[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "podarcis"
version = "13.0.0"
description = "OpenAlex search and local paper ingestion for research vaults over MCP"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.30.0,<2.0.0",
    "pyyaml>=6.0",
    "pdfminer-six>=20231228",
    "httpx",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
podarcis-mcp = "podarcis.server:main"

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]
