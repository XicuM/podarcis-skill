version = 1
agents = ["opencode", "claude", "codex"]

[[skills]]
name = "podarcis"
source = "path:./skills/podarcis"

[[skills]]
name = "overleaf-suggest"
source = "path:./node_modules/overleaf-suggest-mcp"

[[mcp]]
name = "semantic-scholar"
command = "uv"
args = ["run", "--env-file", ".env", "--isolated", "--locked", "--only-group", "semantic-scholar", "s2-mcp-server"]

[[mcp]]
name = "google-drive"
command = "uv"
args = ["run", "--env-file", ".env", "--isolated", "--locked", "--only-group", "google-drive", "workspace-mcp", "--transport", "stdio", "--tools", "drive", "--tool-tier", "core"]

[[mcp]]
name = "overleaf-suggest"
command = "node"
args = ["--env-file=.env", "node_modules/overleaf-suggest-mcp/dist/index.js", "serve"]
